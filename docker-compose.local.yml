# Local smoke test on a machine with an NVIDIA GPU. Copy .env.example to .env first.
services:
  sakura-ai:
    build: .
    ports:
      # Loopback only: never publish the gateway on a LAN/public interface from here.
      - "127.0.0.1:8080:8080"
    env_file: .env
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
