services:
  sakura-ai:
    build: .
    ports:
      - "8080:8080"
    environment:
      OLLAMA_MODEL: gpt-oss:20b
      SAKURA_AI_API_KEY: dev-only-change-me
      VOUCHER_YEN: 100000
      GPU_YEN_PER_HOUR: 0
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
