name: Publish image to Sakura Container Registry
# Manual only. Builds the slim image (no baked model) on GitHub's runner and pushes
# it straight to the registry, so nothing large passes through a home connection.
# Requires repository secrets SAKURA_REGISTRY_USER and SAKURA_REGISTRY_PASSWORD.
on:
  workflow_dispatch:
    inputs:
      registry:
        description: Registry host
        default: sakura-ai.sakuracr.jp
        required: true
      image:
        description: Image name
        default: sakura-ai
        required: true
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ inputs.registry }}
          username: ${{ secrets.SAKURA_REGISTRY_USER }}
          password: ${{ secrets.SAKURA_REGISTRY_PASSWORD }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ inputs.registry }}/${{ inputs.image }}:latest
            ${{ inputs.registry }}/${{ inputs.image }}:${{ github.sha }}
